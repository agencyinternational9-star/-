<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار منظمة الإنقاذ الدولية | IRO Exam</title>
<style>
:root{--bg:#07131a;--card:#0d2028;--card2:#102a34;--teal:#18c7b8;--teal2:#087f83;--text:#eaf7f7;--muted:#9eb9bd;--danger:#ff6b6b;--ok:#45d483}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#07131a,#0b2028);color:var(--text);font-family:Arial,Tahoma,sans-serif;min-height:100vh}
header{padding:22px 16px;text-align:center;border-bottom:1px solid #17343d;background:#081920;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:800;color:var(--teal)} header small{color:var(--muted)}
main{max-width:980px;margin:28px auto;padding:0 16px} .card{background:rgba(13,32,40,.96);border:1px solid #1b414b;border-radius:18px;padding:22px;box-shadow:0 12px 35px #0005;margin-bottom:18px}
h1,h2,h3{margin-top:0} .sub{color:var(--muted);line-height:1.7}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a5660;background:#07171d;color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--teal)} label{display:block;margin:14px 0 7px;font-weight:700}
button{border:0;border-radius:12px;padding:13px 18px;background:var(--teal);color:#032022;font-weight:800;cursor:pointer;font-size:15px}
button.secondary{background:#183943;color:var(--text)} button.danger{background:#a83b49;color:white}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hidden{display:none!important} .error{color:#ff9a9a;margin-top:10px} .success{color:#66e29a;margin-top:10px}
.info{padding:12px 14px;background:#0a2830;border-radius:12px;color:#bce6e4;margin:12px 0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}
.badge{background:#0b3b42;color:#73eee4;border-radius:999px;padding:6px 10px;font-size:13px}
.option{display:block;padding:14px;margin:10px 0;background:#0b1b22;border:1px solid #20424b;border-radius:12px;cursor:pointer;line-height:1.6}
.option:hover{border-color:var(--teal)} .option input{width:auto;margin-left:8px}
.progress{height:9px;background:#17333b;border-radius:20px;overflow:hidden;margin:12px 0 20px} .bar{height:100%;background:var(--teal);width:0}
.score{font-size:38px;font-weight:900;color:var(--teal);text-align:center}
table{width:100%;border-collapse:collapse;margin-top:15px} th,td{padding:9px;border-bottom:1px solid #1c3b43;text-align:right}
footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:600px){main{margin-top:14px} .card{padding:16px} header{position:relative}}

.timer-box{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:10px 0 14px;padding:10px 14px;border-radius:12px;
  background:#0b2029;border:1px solid #18c7b8;color:#fff;font-weight:800;
}
.timer-box.warning{border-color:#ffb020;color:#ffb020;}
.timer-box.danger{border-color:#ff5a5f;color:#ff5a5f;}

/* منع تظليل النصوص ونسخها داخل صفحة الاختبار */
.no-copy {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
</style>
</head>
<body oncontextmenu="return false;">
<header><div class="logo">منظمة الإنقاذ الدولية | International Rescue Organization</div><small>بوابة اختبار التوظيف</small></header>
<main>
<section id="login" class="card">
<h1>دخول الاختبار</h1>
<p class="sub">أدخل اسم الممتحَن ورمز الدخول المخصص لك. كل رمز مصمم للاستخدام مرة واحدة على هذا الجهاز.</p>
<label for="candidate">اسم الممتحَن / الممتحنة</label>
<input id="candidate" maxlength="100" placeholder="اكتب الاسم الكامل">
<label for="code">رمز دخول الاختبار</label>
<input id="code" maxlength="30" autocomplete="off" placeholder="مثال: 482715A">
<div class="actions"><button onclick="startExam()">بدء الاختبار</button></div>
<div id="loginMsg"></div>
</section>

<section id="exam" class="hidden">
<div class="card no-copy">
<div class="qhead"><div><strong id="candidateName"></strong></div><span class="badge" id="counter"></span></div>

<div id="timerBox" class="timer-box">⏱ الوقت المتبقي للسؤال: <span id="timer">20</span> ثانية</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 id="category"></h2>
<p id="question"></p>
<div id="options"></div>
<div class="actions">
<button class="secondary" onclick="prevQ()">السابق</button>
<button onclick="nextQ()" id="nextBtn">التالي</button>
<button class="danger hidden" onclick="finishExam()" id="finishBtn">إنهاء الاختبار</button>
</div>
</div>
</section>

<section id="result" class="hidden card">
<h1>نتيجة الاختبار</h1>
<p id="resultName"></p>
<div class="score" id="score"></div>
<p id="resultText" class="sub"></p>
<div class="actions"><button onclick="window.print()">طباعة النتيجة</button><button class="secondary" onclick="location.reload()">العودة</button></div>
<div id="review"></div>
</section>
</main>
<footer>IRO Exam Portal</footer>

<script>
// منع اختصارات لوحة المفاتيح الخاصة بالنسخ (Ctrl+C, Ctrl+A, Ctrl+U, إلخ) أثناء الاختبار
document.addEventListener('keydown', function(e) {
  if (document.getElementById('exam').classList.contains('hidden')) return;
  if (e.ctrlKey && (e.key === 'c' || e.key === 'a' || e.key === 'u' || e.key === 'p' || e.key === 's')) {
    e.preventDefault();
    alert('عذراً، نسخ الأسئلة أو تظليلها غير مسموح به أثناء الاختبار.');
  }
});

y", "Check for excess water in the ventilator tubing loop"], "answer": "A"}, {"n": 41, "category": "Infectious Disease / Med-Surgical", "q": "A client is admitted with active pulmonary tuberculosis (TB). Which type of isolation precaution must the nurse institute immediately?", "options": ["Standard precautions only", "Contact precautions", "Droplet precautions", "Airborne precautions in a negative pressure room"], "answer": "D"}, {"n": 42, "category": "Pharmacology", "q": "A client is prescribed adenosine for paroxysmal supraventricular tachycardia (PSVT). What is the critical administration technique for this medication?", "options": ["Slow IV infusion over 30 minutes in a large peripheral vein", "Rapid IV push over 1–2 seconds followed immediately by a normal saline flush, via an IV site closest to the heart", "Subcutaneous injection in the abdominal fat pad", "Intramuscular injection in the ventrogluteal site"], "answer": "B"}, {"n": 43, "category": "Gastrointestinal Nursing", "q": "A client with cirrhosis has developed hepatic encephalopathy. The physician prescribes lactulose. What is the primary mechanism of action of lactulose in this condition?", "options": ["Decreasing systemic ammonia production by destroying all intestinal flora", "Lowering intestinal pH, converting ammonia (NH₃) to ammonium (NH₄⁺) which is unabsorbable and excreted in stool", "Stimulating the appetite and restoring liver protein synthesis", "Preventing gastrointestinal bleeding by coating the gastric mucosa"], "answer": "B"}, {"n": 44, "category": "Pediatric Nursing", "q": "A 9-month-old infant is admitted with severe dehydration secondary to acute gastroenteritis. Which clinical sign is the most reliable indicator of moderate to severe dehydration in infants?", "options": ["Presence of tears when crying", "Anterior fontanel depression and delayed capillary refill (> 3 seconds)", "Eruption of lower central incisors", "Active rolling and sitting up independently"], "answer": "B"}, {"n": s cool and blanched. Which medication should the nurse have ready to infiltrate the area?", "options": ["Naloxone hydrochloride", "Protamine sulfate", "Phentolamine mesylate", "Flumazenil"], "answer": "C"}, {"n": 50, "category": "Renal Nursing", "q": "A client with chronic kidney disease asks why they have developed severe anemia. What is the primary cause of anemia in chronic kidney disease?", "options": ["Dietary iron deficiency caused by strict salt restriction", "Decreased renal production of erythropoietin", "Increased destruction of red blood cells in the spleen", "Chronic blood loss through the urinary tract"], "answer": "B"}, {"n": 51, "category": "Critical Care Nursing", "q": "A patient connected to an arterial line for continuous blood pressure monitoring suddenly has a dampening of the waveform and inaccurate readings. What troubleshooting step should the nurse perform first?", "options": ["Check the pressure bag to ensure it is inflated to 300 mmHg and flush the system", "Immediately remove the arterial catheter from the radial artery", "Calibrate the monitor by setting zero at the earlobe level", "Administer a vasopressor medication"], "answer": "A"}, {"n": 52, "category": "Pediatric Nursing", "q": "A school-age child with type 1 diabetes mellitus is brought to the emergency department with fruity breath odor, Kussmaul respirations, nausea, and a blood glucose level of 480 mg/dL. What nursing diagnosis takes highest priority?", "options": ["Deficient fluid volume related to osmotic diuresis", "Ineffective health maintenance related to disease process", "Risk for delayed growth and development", "Powerlessness related to chronic illness"], "answer": "A"}, {"n": 53, "category": "Maternal-Newborn Nursing", "q": "A nurse is performing a routine postpartum assessment on a client 12 hours after delivery. The nurse palpates the fundus and finds it 2 cm above the umbilicus and soft/boggy. What is the nurse's first action?", "options": ["Massage the fundus gently until firm", "Administer oxytocin as ordered", "Notify the obstetrician immediately", "Prepare the client for immediate surgery"], "answer": "A"}, {"n": 54, "category": "Mental Health Nursing", "q": "A client admitted to the psychiatric unit believes that the food being served is poisoned by government agents. What is the most therapeutic nursing response?", "options": ["“That is ridiculous; nobody is trying to poison you.”", "“Why do you think anyone would want to poison you?”", "“I understand you believe the food is poisoned, but I can assure you it is safe to eat.”", "“Let's talk about something else so you can forget about the food.”"], "answer": "C"}, {"n": 55, "category": "Medical-Surgical Nursing", "q": "A client is scheduled for an intravenous pyelogram (IVP). Which client allergy is most critical for the nurse to screen for prior to the procedure?", "options": ["Penicillin and cephalosporins", "Shellfish, iodine, or radiopaque contrast media", "Latex and rubber products", "Adhesive tape and latex"], "answer": "B"}, {"n": 56, "category": "Pharmacology", "q": "A client taking spironolactone for heart failure is instructed on dietary modifications. Which dietary item should the client be advised to avoid or limit?", "options": ["Citrus fruits like oranges and grapefruits", "Salt substitutes containing potassium chloride", "Low-fat dairy products like skim milk", "Refined white bread and pasta"], "answer": "B"}, {"n": 57, "category": "Emergency & Trauma Nursing", "q": "Following a motor vehicle accident, a patient is brought in with a rigid, board-like abdomen, severe abdominal pain, and rebound tenderness. What life-threatening complication is most likely present?", "options": ["Acute appendicitis", "Peritonitis due to internal organ perforation/rupture", "Mild gastroenteritis", "Simple acute gastritis"], "answer": "B"}, {"n": 58, "category": "Cardiovascular Nursing", "q": "A client is admitted with unstable angina. Which ECG finding is characteristic of myo  "Mild osteoarthritis"], "answer": "B"}, {"n": 63, "category": "Mental Health Nursing", "q": "A client diagnosed with borderline personality disorder exhibits manipulative and splitting behaviors among nursing staff. What is the most effective nursing management strategy?", "options": ["Allow each shift nurse to set different rules to accommodate the client", "Establish consistent, clear limits and enforce boundaries with all staff members communicating as a team", "Ignore the client completely whenever manipulative behavior occurs", "Grant special privileges to the client to keep them happy"], "answer": "B"}, {"n": 64, "category": "Community Health Nursing", "q": "A community health nurse is planning an immunization campaign for measles. Which type of immunity is conferred by the measles, mumps, and rubella (MMR) vaccine?", "options": ["Natural active immunity", "Artificial active immunity", "Natural passive immunity", "Artificial passive immunity"], "answer": "B"}, {"n": 65, "category": "Medical-Surgical Nursing", "q": "A client returns from the post-anesthesia care unit (PACU) following a thyroidectomy. The nurse places a tracheostomy tray and suction equipment at the bedside primarily to manage which emergency?", "options": ["Acute hemorrhage from the surgical wound", "Acute airway obstruction due to edema or laryngeal spasm", "Severe postoperative nausea and vomiting", "Sudden hypocalcemic tetany"], "answer": "B"}, {"n": 66, "category": "Pediatric Nursing", "q": "A 5-year-old child is diagnosed with acute lymphocytic leukemia (ALL) and is receiving chemotherapy. The mother reports the child has been exposed to chickenpox at kindergarten 2 days ago. What is the nurse's priority action?", "options": ["Tell the mother to bring the child to the clinic for routine checkup next week", "Notify the physician immediately so that varicella-zoster immune globulin (VZIG) can be considered", "Administer oral aspirin for fever", "Isolate the child at home without notifying healthcare providers"], "answer": "B"}, {"n": 67, "category": "Maternal-Newborn Nursing", "q": "A newborn infant is noted to have yellow sclera and skin jaundice at 18 hours of life. What classification of jaundice does this represent?", "options": ["Physiological jaundice (normal finding)", "Pathological jaundice (requires immediate investigation)", "Breast milk jaundice", "Carotenemia from maternal diet"], "answer": "B"}, {"n": 68, "category": "Critical Care Nursing", "q": "A client with a central venous catheter (CVC) in the subclavian vein suddenly complains of chest pain, severe dyspnea, and tachypnea. Auscultation reveals absent breath sounds on the affected side. What complication should the nurse suspect?", "options": ["Pulmonary embolism", "Air embolism or iatrogenic pneumothorax", "Cardiac arrest", "Catheter-related bloodstream infection"], "answer": "B"}, {"n": 69, "category": "Pharmacology", "q": "A client is prescribed levothyroxine for hypothyroidism. What is the optimal time of day for the client to take this medication?", "options": ["At bedtime right after a heavy meal", "In the morning on an empty stomach with a full glass of water, 30-60 minutes before breakfast", "With lunch to prevent gastric irritation", "Mid-afternoon with a snack"], "answer": "B"}, {"n": 70, "category": "Mental Health Nursing", "q": "A client with post-traumatic stress disorder (PTSD) experiences a sudden flashback of a traumatic combat event, becoming panicked and aggressive. What is the initial nursing action?", "options": ["Leave the client alone in a dark room until they calm down", "Remain calm, stay with the client, speak in a reassuring voice, and ensure a safe environment", "Restrain the client immediately with physical soft wrist restraints", "Administer high-dose antipsychotics without assessment"], "answer": "B"}, {"n": 71, "category": "Medical-Surgical Nursing", "q": "A client with chronic kidney disease is prescribed aluminum hydroxide gel. What is the therapeutic purpose of this medication in kidney disease?", "options": ["To bind dietary phosphate in the gastrointestinal tract and lower serum phosphate levels", "To reduce gastric acid and prevent peptic ulcers", "To stimulate red blood cell production in bone marrow", "To increase urinary excretion of sodium"], "answer": "A"}, {"n": 72, "category": "Pediatric Nursing", "q": "An infant is born with an incomplete closure of the spinal canal and a visible sac-like cyst containing meninges and spinal cord elements protruding through the defect. What is this neural tube defect called?", "options": ["Spina bifida occulta", "Meningocele", "Myelomeningocele", "Anencephaly"], "answer": "C"}, {"n": 73, "category": "Cardiovascular Nursing", "q": "A client with infective endocarditis develops sudden left upper quadrant abdominal pain radiating to the left shoulder (Kehr's sign). What complication does this suggest?", "options": ["Splenic infarction or rupture", "Acute myocardial infarction", "Renal failure", "Mesenteric ischemia"], "answer": "A"}, {"n": 74, "category": "Pharmacology", "q": "A client is receiving total parenteral nutrition (TPN) through a central venous access line. The TPN bag finishes, and the new bag is not yet available from the pharmacy. What intravenous solution should the nurse hang immediately to prevent severe hypoglycemia?", "options": ["0.9% Normal Saline", "5% Dextrose in Water (D5W) or 10% Dextrose in Water", "Lactated Ringer's solution", "0.45% Sodium Chloride"], "answer": "B"}, {"n": 75, "category": "Emergency & Trauma Nursing", "q": "A client presents with severe burns covering the anterior trunk and both anterior legs (Rule of Nines). What is the estimated total body surface area (TBSA) burned?", "options": ["18%", "27%", "36%", "45%"], "answer": "C"}, {"n": 76, "category": "Mental Health Nursing", "q": "A patient with bipolar disorder in a manic phase is pacing the hallway, speaking in rapid, loud, pun-filled sentences, and refusing to eat. What is the priority nursing intervention regarding nutrition?", "options": ["Insist that the client sit at a table for 30 minutes to eat a full meal", "Provide high-calorie, nutritious finger foods that the client can eat while pacing", "Withhold food until the manic episode subsides completely", "Administer tube feeding immediately"], "answer": "B"}, {"n": 77, "category": "Medical-Surgical Nursing", "q": "A client is recovering from an endoscopic retrograde cholangiopancreatography (ERCP). Which post-procedure assessment finding requires immediate reporting to the physician?", "options": ["Mild sore throat", "Sudden onset of severe abdominal pain and rigid abdomen (signs of perforation or pancreatitis)", "Mild drowsiness from sedation", "Low-grade fatigue"], "answer": "B"}, {"n": 78, "category": "Maternal-Newborn Nursing", "q": "A pregnant client at 28 weeks gestation is Rh-negative and antibody-negative. Her husband is Rh-positive. When should the nurse expect the client to receive Rho(D) immune globulin (RhoGAM)?", "options": ["Only after delivery if the baby is Rh-positive", "At 28 weeks gestation and again within 72 hours postpartum if the newborn is Rh-positive", "Immediately during the first trimester only", "RhoGAM is not indicated in this scenario"], "answer": "B"}, {"n": 79, "category": "Pediatric Nursing", "q": "A toddler is diagnosed with acute laryngotracheobronchitis (croup). Which clinical manifestation should the nurse expect during assessment?", "options": ["Inspiratory stridor, \"barking\" seal-like cough, and hoarseness", "Drooling, high fever, and severe dysphagia", "Wheezing and copious thick mucus production", "Sudden apnea and bradycardia"], "answer": "A"}, {"n": 80, "category": "Pharmacology", "q": "A client is prescribed warfarin therapy. Which laboratory test is used to monitor the therapeutic effectiveness of warfarin?", "options": ["Activated partial thromboplastin time (aPTT)", "Prothrombin time (PT) and International Normalized Ratio (INR)", "Bleeding time", "Platelet count"], "answer": "B"}, {"n": 81, "category": "Critical Care Nursing", "q": "A client in the ICU is diagnosed with disseminated intravascular coagulation (DIC). Which laboratory profile is characteristically associated with DIC?", "options": ["Prolonged PT, aPTT, and thrombin time; decreased fibrinogen and platelets; elevated D-dimer", "Decreased PT and aPTT; elevated fibrinogen and platelets", "Normal coagulation profile with isolated thrombocytopenia", "Elevated red blood cell count and hemoglobin"], "answer": "A"}, {"n": 82, "category": "Medical-Surgical / Neurology", "q": "A client is admitted following an ischemic stroke. Which intervention is crucial within the first 24-48 hours to prevent complications of immobility and venous stasis?", "options": ["Strict bed rest with no movement of limbs", "Early mobilization and application of sequential compression devices (SCDs)", "Massage of the lower extremities vigorously", "Restriction of all fluid intake"], "answer": "B"}, {"n": 83, "category": "Mental Health Nursing", "q": "A client with anorexia nervosa has a body mass index (BMI) of 13, profound bradycardia, hypotension, and electrolyte disturbances. What is the priority nursing goal?", "options": ["Immediate weight restoration, nutritional rehabilitation, and medical stabilization", "Exploring childhood family dynamics in depth", "Teaching independent grocery shopping", "Discussing vocational career goals"], "answer": "A"}, {"n": 84, "category": "Community Health Nursing", "q": "When designing a health education program for a community with a high prevalence of type 2 diabetes, what should be the nurse's first step?", "options": ["Hand out expensive pre-printed brochures immediately", "Assess the community's specific learning needs, cultural background, and baseline knowledge", "Assume everyone knows the basic dietary rules", "Schedule lectures without consulting community leaders"], "answer": "B"}, {"n": 85, "category": "Cardiovascular Nursing", "q": "A client is diagnosed with infective endocarditis. What is the most important nursing measure when administering prescribed intravenous antibiotic therapy?", "options": ["Infusing each dose exactly on schedule to maintain therapeutic blood levels", "Giving antibiotics only when the patient has a fever spike", "Stopping antibiotics once the patient feels better after 2 days", "Mixing all antibiotic doses in one large infusion bag"], "answer": "A"}, {"n": 86, "category": "Pediatric Nursing", "q": "An infant with Hirschsprung's disease is admitted for surgery. What clinical finding is characteristic of this condition in newborns?", "options": ["Passage of normal meconium within the first 24 hours of life", "Failure to pass meconium within the first 24-48 hours, accompanied by abdominal distension and bilious vomiting", "Constant diarrhea and ravenous appetite", "Rectal bleeding and severe abdominal cramps"], "answer": "B"}, {"n": 87, "category": "Maternal-Newborn Nursing", "q": "A pregnant client at 32 weeks gestation presents with painless, bright red vaginal bleeding. Her uterus is soft and non-tender. What condition should the nurse suspect?", "options": ["Placental abruption", "Placenta previa", "Uterine rupture", "Ectopic pregnancy"], "answer": "B"}, {"n": 88, "category": "Pharmacology", "q": "A client is prescribed lithium carbonate. Which electrolyte imbalance can precipitate lithium toxicity and must be monitored closely?", "options": ["Hypernatremia", "Hyponatremia (sodium depletion)", "Hyperkalemia", "Hypercalcemia"], "answer": "B"}, {"n": 89, "category": "Emergency Nursing", "q": "A patient is brought to the emergency department after sustaining multiple electrical burns from a high-tension power line. What hidden complication should the nurse monitor most closely?", "options": ["Cardiac arrhythmias and deep tissue/muscle damage", "Superficial skin sunburns only", "Chronic ear infections", "Mild dehydration"], "answer": "A"}, {"n": 90, "category": "Medical-Surgical Nursing", "q": "A client with chronic kidney disease is scheduled for hemodialysis. The nurse assesses the arteriovenous (AV) fistula in the left arm. Which finding indicates the fistula is patent and functioning properly?", "options": ["Absence of bruit and thrill", "Palpable thrill and audible bruit upon auscultation", "Cool skin temperature and sluggish capillary refill distal to the fistula", "Strong pulse without any vibration"], "answer": "B"}, {"n": 91, "category": "Mental Health Nursing", "q": "A client with major depressive disorder who has been expressing suicidal ideation suddenly appears calm, peaceful, and gives away valued personal possessions. What is the nurse's immediate interpretation and action?", "options": ["The client is fully cured and ready for immediate discharge", "The client may have decided on a suicide plan and has acquired the means; initiate suicide precautions and constant observation", "The medication has achieved full permanent recovery", "The client is experiencing normal adjustment"], "answer": "B"}, {"n": 92, "category": "Pediatric Nursing", "q": "A 3-year-old child is brought to the clinic with otitis media. Why are infants and young children anatomically more prone to middle ear infections than adults?", "options": ["Eustachian tubes are longer, narrower, and vertically oriented", "Eustachian tubes are shorter, wider, and more horizontal", "The tympanic membrane is thicker in children", "Children produce more earwax naturally"], "answer": "B"}, {"n": 93, "category": "Pharmacology & Critical Care", "q": "A client is receiving an infusion of magnesium sulfate for severe preeclampsia. Which assessment finding indicates early magnesium toxicity and requires immediate cessation of the infusion?", "options": ["Hyperactive deep tendon reflexes", "Loss of deep tendon reflexes (hyporeflexia) and respiratory depression", "Hypertension and tachycardia", "Increased urine output above 100 mL/h"], "answer": "B"}, {"n": 94, "category": "Cardiovascular Nursing", "q": "A client with heart failure is prescribed a daily weight log. What weight gain parameter should the nurse instruct the client to report immediately to the physician?", "options": ["Weight gain of 1-2 pounds in one week", "Weight gain of 2-3 pounds in one day or 5 pounds in a week", "Weight fluctuation of 0.5 pounds monthly", "Any weight loss of 10 pounds"], "answer": "B"}, {"n": 95, "category": "Medical-Surgical Nursing", "q": "A client is diagnosed with iron deficiency anemia. The nurse instructs the client on taking oral iron supplements. Which instruction promotes optimal absorption and minimizes gastrointestinal side effects?", "options": ["Take iron with milk or antacids immediately after meals", "Take iron with vitamin C (ascorbic acid) between meals, and expect dark green or black stools", "Crush the iron tablets and mix them with coffee", "Stop taking iron if stools become dark"], "answer": "B"}, {"n": 96, "category": "Respiratory Nursing", "q": "A client undergoes a thoracentesis for pleural effusion. During the procedure, the client suddenly becomes dizzy, pale, experiences dyspnea, and coughs up pink frothy sputum. What complication is occurring?", "options": ["Re-expansion pulmonary edema", "Tension pneumothorax", "Hemorrhage at puncture site", "Simple vasovagal syncope"], "answer": "A"}, {"n": 97, "category": "Pediatric Nursing", "q": "An infant is diagnosed with pyloric stenosis. What is the classic clinical presentation reported by the parents?", "options": ["Projectile, non-bilious vomiting occurring after feeding, and an olive-sized mass in the upper right quadrant", "Bilious vomiting and currant jelly stools", "Constant diarrhea and weight gain", "High fever and upper respiratory congestion"], "answer": "A"}, {"n": 98, "category": "Mental Health Nursing", "q": "A client with catatonic schizophrenia remains motionless in a rigid bizarre posture for hours. What is this specific motor symptom called?", "options": ["Waxy flexibility (catalepsy)", "Echopraxia", "Flight of ideas", "Tangentiality"], "answer": "A"}, {"n": 99, "category": "Community Health Nursing", "q": "During a community assessment, a nurse identifies high rates of waterborne diseases due to contaminated water supplies. Which level of prevention does providing safe drinking water systems represent?", "options": ["Primary prevention", "Secondary prevention", "Tertiary prevention", "Quaternary prevention"], "answer": "A"}, {"n": 100, "category": "Critical Care / Emergency/Nursing", "q": "A patient is brought to the emergency department in cardiac arrest. The cardiac monitor shows ventricular fibrillation (VF). What is the immediate priority intervention after starting CPR?", "options": ["Administer IV atropine", "Perform immediate defibrillation (shock delivery) per ACLS protocol", "Intubate the patient before any rhythm check", "Administer oral medications"], "answer": "B"}], "codes":["482715A","936204B","157839C","604281D","729516E","381047F","845293G","216758H","593120I","704681J","328954K","917436L","460285M","781609N","235714O","649382P","108527Q","572943R","894316S","351768T"]};
let questions=BANK.questions, codes=BANK.codes;
let idx=0, answers=Array(questions.length).fill(null), candidate="", usedCode="";
let timerInterval=null, timeLeft=20;

function msg(text,type="error"){document.getElementById("loginMsg").innerHTML='<div class="'+type+'">'+text+'</div>';}

function startExam(){
 candidate=document.getElementById("candidate").value.trim();
 const rawCode=document.getElementById("code").value;
 const code=rawCode.replace(/[\s\u200B-]/g,"").toUpperCase();
 if(!candidate) return msg("يرجى إدخال اسم الممتحَن.");
 if(!code) return msg("يرجى إدخال رمز الدخول.");
 if(!codes.includes(code)) return msg("رمز الدخول غير صحيح. تأكد من كتابة الرمز مثل 482715A بدون مسافات.");
 usedCode=code;
 document.getElementById("candidateName").textContent=candidate;
 document.getElementById("login").classList.add("hidden");
 document.getElementById("exam").classList.remove("hidden");
 render();
}

function startQuestionTimer(){
  clearInterval(timerInterval);
  timeLeft = 20;
  const timerEl = document.getElementById("timer");
  const box = document.getElementById("timerBox");
  if(timerEl) timerEl.textContent = timeLeft;
  if(box) box.className = "timer-box";

  timerInterval = setInterval(() => {
    timeLeft--;
    if(timerEl) timerEl.textContent = timeLeft;

    if(box){
      box.className = "timer-box" + (timeLeft <= 5 ? " danger" : timeLeft <= 10 ? " warning" : "");
    }

    if(timeLeft <= 0){
      clearInterval(timerInterval);
      if(idx < questions.length - 1){
        idx++;
        render();
      } else {
        finishExam();
      }
    }
  }, 1000);
}

function render(){
 startQuestionTimer();
 const x=questions[idx];
 document.getElementById("counter").textContent="السؤال "+(idx+1)+" من "+questions.length;
 document.getElementById("category").textContent=x.category;
 document.getElementById("question").textContent=x.q;
 document.getElementById("bar").style.width=((idx+1)/questions.length*100)+"%";
 const labels=["A","B","C","D"], box=document.getElementById("options"); box.innerHTML="";
 x.options.forEach((o,i)=>{
  const l=document.createElement("label"); l.className="option";
  l.innerHTML='<input type="radio" name="answer" value="'+labels[i]+'"> <strong>'+labels[i]+".</strong> "+escapeHtml(o);
  l.querySelector("input").checked=answers[idx]===labels[i];
  l.querySelector("input").addEventListener("change",e=>answers[idx]=e.target.value);
  box.appendChild(l);
 });
 document.getElementById("nextBtn").classList.toggle("hidden",idx===questions.length-1);
 document.getElementById("finishBtn").classList.toggle("hidden",idx!==questions.length-1);
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

function prevQ(){
  if(idx>0){
    idx--;
    render();
    window.scrollTo(0,0);
  }
}

function nextQ(){
  if(answers[idx]===null) return alert("اختر إجابة أولاً.");
  if(idx<questions.length-1){
    idx++;
    render();
    window.scrollTo(0,0);
  }
}

function finishExam(){
  clearInterval(timerInterval);
  if(answers[idx]===null && idx === questions.length-1) return alert("اختر إجابة السؤال الأخير أولاً.");
  const score=answers.reduce((n,a,i)=>n+(a===questions[i].answer?1:0),0);
  document.getElementById("exam").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultName").textContent="الممتحَن/ة: "+candidate;
  document.getElementById("score").textContent=score+" / "+questions.length;
  document.getElementById("resultText").textContent="نسبة النجاح: "+(score/questions.length*100).toFixed(1)+"%";
  let html='<h3>مراجعة الإجابات</h3><table><tr><th>#</th><th>إجابتك</th><th>الإجابة الصحيحة</th></tr>';
  questions.forEach((q,i)=>html+='<tr><td>'+q.n+'</td><td>'+(answers[i]||"—")+'</td><td>'+q.answer+'</td></tr>');
  html+='</table>'; document.getElementById("review").innerHTML=html;
}
</script>
